services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-gateway
    environment:
      BULLEX_SERVICE_URL: "http://bullex-service:8000"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"
      PANEL_API_KEY: "${PANEL_API_KEY:-change-me}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
      ROBOT_REAL_MAX_ENTRY: "${ROBOT_REAL_MAX_ENTRY:-10}"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - bullex-service

  bullex-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bullex-service
    environment:
      BULLEX_MAX_CONCURRENT_API_CALLS: "1"
    expose:
      - "8000"
    restart: unless-stopped
