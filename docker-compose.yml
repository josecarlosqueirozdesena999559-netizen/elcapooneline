services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-gateway
    environment:
      BULLEX_SERVICE_URL: "http://bullex-service:8000"
      CORS_ORIGINS: "https://elcapobot.online,https://www.elcapobot.online,http://localhost:5173,http://localhost:3000"
      PANEL_API_KEY: "${PANEL_API_KEY:-change-me}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
      ROBOT_REAL_MAX_ENTRY: "${ROBOT_REAL_MAX_ENTRY:-10}"
      ROBOT_DB_PATH: "/data/backend-persistence.db"
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - bullex-service

  bullex-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bullex-service
    environment:
      CORS_ORIGINS: "https://elcapobot.online,https://www.elcapobot.online,http://localhost:5173,http://localhost:3000"
      BULLEX_MAX_CONCURRENT_API_CALLS: "1"
      BULLEX_SESSION_DB_PATH: "/data/bullex-sessions.db"
      BULLEX_SESSION_ENCRYPTION_KEY: "${BULLEX_SESSION_ENCRYPTION_KEY:-}"
    volumes:
      - bullex-session-data:/data
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  backend-data:
  bullex-session-data:
